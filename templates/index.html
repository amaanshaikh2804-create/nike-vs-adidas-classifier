<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nike or Adidas?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f6;--ink:#101318;--card:#fff;--line:#c9ced6;--muted:#5b6370;--nike:#e8470f;--adidas:#1f4fe0}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--ink:#f1f2f4;--card:#1a1d23;--line:#3a404b;--muted:#9aa3b0}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;font-family:'Archivo',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:18px 28px;font-weight:800;font-size:1.05rem}
.versus{flex:1;display:flex;position:relative;min-height:540px}
.side{flex:1 1 0;display:flex;flex-direction:column;justify-content:flex-end;padding:32px;color:#fff;overflow:hidden;transition:flex-grow .6s cubic-bezier(.2,.8,.2,1)}
.nike{background:var(--nike)}
.adidas{background:var(--adidas);align-items:flex-end;text-align:right}
.name{font-size:clamp(3rem,11vw,9.5rem);font-weight:900;font-stretch:125%;letter-spacing:-.04em;line-height:.9}
.pct{font-size:1.3rem;font-weight:700;margin-top:10px;opacity:0;transition:opacity .4s .3s}
.versus[data-winner=nike] .nike,.versus[data-winner=adidas] .adidas{flex-grow:1.9}
.versus[data-winner=nike] .adidas,.versus[data-winner=adidas] .nike{flex-grow:.7}
.versus[data-winner] .pct{opacity:1}
.drop{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(340px,86vw);background:var(--card);border:2px dashed var(--line);border-radius:18px;padding:22px 20px;text-align:center;cursor:pointer;z-index:2}
.drop:hover,.drop.over{border-color:var(--ink)}
.drop:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#preview{display:none;max-width:100%;max-height:200px;margin:0 auto 14px;border-radius:10px}
#verdict{font-size:1.5rem;font-weight:800;margin:0}
#msg{margin:6px 0 0;color:var(--muted);font-size:.95rem;line-height:1.4}
#msg.err{color:#d93025}
@media (max-width:700px){.versus{flex-direction:column}.adidas{align-items:flex-start;text-align:left}.side{padding:20px}}
@media (prefers-reduced-motion:reduce){.side,.pct{transition:none}}
</style>
</head>
<body>
<header>Nike or Adidas?</header>
<main class="versus" id="versus">
  <section class="side nike"><div class="name">Nike</div><div class="pct" id="pn"></div></section>
  <section class="side adidas"><div class="name">Adidas</div><div class="pct" id="pa"></div></section>
  <div class="drop" id="drop" role="button" tabindex="0" aria-label="Choose a shoe photo">
    <img id="preview" alt="Your shoe photo">
    <p id="verdict">Drop a shoe photo</p>
    <p id="msg">or click to choose a JPG or PNG</p>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const drop = $('#drop'), input = $('#file'), prev = $('#preview');
const verdict = $('#verdict'), msg = $('#msg'), versus = $('#versus');

drop.onclick = () => input.click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => { if (e.dataTransfer.files[0]) run(e.dataTransfer.files[0]); });
input.onchange = () => { if (input.files[0]) run(input.files[0]); };

async function run(file) {
  prev.src = URL.createObjectURL(file);
  prev.style.display = 'block';
  delete versus.dataset.winner;
  msg.className = '';
  verdict.textContent = 'Checking…';
  msg.textContent = '';
  const form = new FormData();
  form.append('image', file);
  try {
    const res = await fetch('/predict', { method: 'POST', body: form });
    const d = await res.json();
    if (!res.ok) throw new Error(d.error);
    const winner = d.nike >= d.adidas ? 'nike' : 'adidas';
    const top = Math.max(d.nike, d.adidas);
    $('#pn').textContent = (d.nike * 100).toFixed(1) + '%';
    $('#pa').textContent = (d.adidas * 100).toFixed(1) + '%';
    versus.dataset.winner = winner;
    const name = winner === 'nike' ? 'Nike' : 'Adidas';
    verdict.textContent = top < 0.6 ? `Closer to ${name}` : name;
    msg.textContent = top < 0.6 ? 'The model isn’t sure. Try a clearer photo.' : 'Click to try another photo';
  } catch (err) {
    verdict.textContent = 'Couldn’t check this photo';
    msg.className = 'err';
    msg.textContent = err.message || 'Is the server running? Start it with python app.py';
  }
}
</script>
</body>
</html>
